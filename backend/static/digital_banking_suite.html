<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Banking Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900">
    <div id="root"></div>
    
    <script type="text/babel">
        const App = () => {
  const [currentPage, setCurrentPage] = React.useState('dashboard');
  const [user, setUser] = React.useState({
    name: 'John Smith',
    accountNumber: '****1234',
    balance: 15847.32,
    isAuthenticated: true
  });

  // Mock data
  const accounts = [
    { id: 1, type: 'Checking', balance: 8547.32, number: '****1234' },
    { id: 2, type: 'Savings', balance: 7300.00, number: '****5678' },
    { id: 3, type: 'Credit Card', balance: -2450.50, number: '****9012' }
  ];

  const transactions = [
    { id: 1, date: '2024-01-15', description: 'Online Transfer to Savings', amount: -500.00, type: 'transfer' },
    { id: 2, date: '2024-01-14', description: 'Grocery Store Payment', amount: -127.45, type: 'purchase' },
    { id: 3, date: '2024-01-13', description: 'Salary Deposit', amount: 3250.00, type: 'deposit' },
    { id: 4, date: '2024-01-12', description: 'ATM Withdrawal', amount: -200.00, type: 'withdrawal' },
    { id: 5, date: '2024-01-11', description: 'Online Bill Payment - Electric', amount: -89.32, type: 'bill' },
    { id: 6, date: '2024-01-10', description: 'Restaurant Payment', amount: -67.80, type: 'purchase' }
  ];

  const paymentRequests = [
    { id: 1, recipient: 'Sarah Johnson', amount: 250.00, status: 'pending' },
    { id: 2, recipient: 'Mike Chen', amount: 75.50, status: 'completed' },
    { id: 3, recipient: 'Electric Company', amount: 189.32, status: 'scheduled' }
  ];

  const Navigation = () => (
    <nav className="bg-slate-800 border-b border-slate-700">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div className="flex justify-between h-16">
          <div className="flex items-center">
            <div className="flex-shrink-0">
              <h1 className="text-xl font-bold text-blue-400">SecureBank</h1>
            </div>
            <div className="ml-10 flex space-x-8">
              <button
                onClick={() => setCurrentPage('dashboard')}
                className={`px-3 py-2 rounded-md text-sm font-medium transition-colors ${
                  currentPage === 'dashboard' 
                    ? 'bg-slate-700 text-white' 
                    : 'text-slate-300 hover:text-white hover:bg-slate-700'
                }`}
              >
                Dashboard
              </button>
              <button
                onClick={() => setCurrentPage('accounts')}
                className={`px-3 py-2 rounded-md text-sm font-medium transition-colors ${
                  currentPage === 'accounts' 
                    ? 'bg-slate-700 text-white' 
                    : 'text-slate-300 hover:text-white hover:bg-slate-700'
                }`}
              >
                Accounts
              </button>
              <button
                onClick={() => setCurrentPage('payments')}
                className={`px-3 py-2 rounded-md text-sm font-medium transition-colors ${
                  currentPage === 'payments' 
                    ? 'bg-slate-700 text-white' 
                    : 'text-slate-300 hover:text-white hover:bg-slate-700'
                }`}
              >
                Payments
              </button>
              <button
                onClick={() => setCurrentPage('analytics')}
                className={`px-3 py-2 rounded-md text-sm font-medium transition-colors ${
                  currentPage === 'analytics' 
                    ? 'bg-slate-700 text-white' 
                    : 'text-slate-300 hover:text-white hover:bg-slate-700'
                }`}
              >
                Analytics
              </button>
            </div>
          </div>
          <div className="flex items-center space-x-4">
            <div className="text-sm">
              <span className="text-slate-300">Welcome, </span>
              <span className="text-white font-medium">{user.name}</span>
            </div>
            <button className="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-md text-sm font-medium transition-colors">
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>
  );

  const DashboardPage = () => (
    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div className="mb-8">
        <h2 className="text-3xl font-bold text-white">Account Dashboard</h2>
        <p className="text-slate-400 mt-2">Overview of your banking activities</p>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div className="bg-slate-800 rounded-lg p-6 border border-slate-700">
          <h3 className="text-lg font-medium text-slate-300 mb-2">Total Balance</h3>
          <p className="text-3xl font-bold text-green-400">${user.balance.toLocaleString()}</p>
          <p className="text-sm text-slate-400 mt-2">Across all accounts</p>
        </div>
        <div className="bg-slate-800 rounded-lg p-6 border border-slate-700">
          <h3 className="text-lg font-medium text-slate-300 mb-2">Monthly Spending</h3>
          <p className="text-3xl font-bold text-red-400">$2,847</p>
          <p className="text-sm text-green-400 mt-2">↓ 12% from last month</p>
        </div>
        <div className="bg-slate-800 rounded-lg p-6 border border-slate-700">
          <h3 className="text-lg font-medium text-slate-300 mb-2">Pending Payments</h3>
          <p className="text-3xl font-bold text-yellow-400">3</p>
          <p className="text-sm text-slate-400 mt-2">Awaiting processing</p>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div className="bg-slate-800 rounded-lg border border-slate-700">
          <div className="p-6 border-b border-slate-700">
            <h3 className="text-xl font-semibold text-white">Quick Actions</h3>
          </div>
          <div className="p-6">
            <div className="grid grid-cols-2 gap-4">
              <button className="bg-blue-600 hover:bg-blue-700 p-4 rounded-lg text-center transition-colors">
                <div className="text-2xl mb-2">💸</div>
                <div className="font-medium">Send Money</div>
              </button>
              <button className="bg-green-600 hover:bg-green-700 p-4 rounded-lg text-center transition-colors">
                <div className="text-2xl mb-2">💳</div>
                <div className="font-medium">Pay Bills</div>
              </button>
              <button className="bg-purple-600 hover:bg-purple-700 p-4 rounded-lg text-center transition-colors">
                <div className="text-2xl mb-2">📊</div>
                <div className="font-medium">View Reports</div>
              </button>
              <button className="bg-orange-600 hover:bg-orange-700 p-4 rounded-lg text-center transition-colors">
                <div className="text-2xl mb-2">⚙️</div>
                <div className="font-medium">Settings</div>
              </button>
            </div>
          </div>
        </div>

        <div className="bg-slate-800 rounded-lg border border-slate-700">
          <div className="p-6 border-b border-slate-700">
            <h3 className="text-xl font-semibold text-white">Recent Transactions</h3>
          </div>
          <div className="p-6">
            <div className="space-y-4">
              {transactions.slice(0, 5).map(transaction => (
                <div key={transaction.id} className="flex justify-between items-center">
                  <div>
                    <div className="font-medium text-white">{transaction.description}</div>
                    <div className="text-sm text-slate-400">{transaction.date}</div>
                  </div>
                  <div className={`font-semibold ${
                    transaction.amount > 0 ? 'text-green-400' : 'text-red-400'
                  }`}>
                    {transaction.amount > 0 ? '+' : ''}${Math.abs(transaction.amount).toFixed(2)}
                  </div>
                </div>
              ))}
            </div>
            <button 
              onClick={() => setCurrentPage('accounts')}
              className="w-full mt-4 text-blue-400 hover:text-blue-300 text-sm font-medium transition-colors"
            >
              View All Transactions →
            </button>
          </div>
        </div>
      </div>
    </div>
  );

  const AccountsPage = () => (
    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div className="mb-8">
        <h2 className="text-3xl font-bold text-white">Account Management</h2>
        <p className="text-slate-400 mt-2">Manage your accounts and view transaction history</p>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        {accounts.map(account => (
          <div key={account.id} className="bg-slate-800 rounded-lg p-6 border border-slate-700">
            <div className="flex justify-between items-start mb-4">
              <div>
                <h3 className="text-lg font-semibold text-white">{account.type}</h3>
                <p className="text-slate-400 text-sm">{account.number}</p>
              </div>
              <div className="text-right">
                <div className={`text-2xl font-bold ${
                  account.balance < 0 ? 'text-red-400' : 'text-green-400'
                }`}>
                  ${Math.abs(account.balance).toLocaleString()}
                </div>
                {account.balance < 0 && (
                  <div className="text-xs text-red-400">Outstanding</div>
                )}
              </div>
            </div>
            <div className="flex space-x-2">
              <button className="flex-1 bg-blue-600 hover:bg-blue-700 py-2 px-3 rounded text-sm transition-colors">
                Transfer
              </button>
              <button className="flex-1 bg-slate-700 hover:bg-slate-600 py-2 px-3 rounded text-sm transition-colors">
                Details
              </button>
            </div>
          </div>
        ))}
      </div>

      <div className="bg-slate-800 rounded-lg border border-slate-700">
        <div className="p-6 border-b border-slate-700">
          <h3 className="text-xl font-semibold text-white">Transaction History</h3>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full">
            <thead className="bg-slate-700">
              <tr>
                <th className="px-6 py-3 text-left text-xs font-medium text-slate-300 uppercase tracking-wider">Date</th>
                <th className="px-6 py-3 text-left text-xs font-medium text-slate-300 uppercase tracking-wider">Description</th>
                <th className="px-6 py-3 text-left text-xs font-medium text-slate-300 uppercase tracking-wider">Type</th>
                <th className="px-6 py-3 text-right text-xs font-medium text-slate-300 uppercase tracking-wider">Amount</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-700">
              {transactions.map(transaction => (
                <tr key={transaction.id} className="hover:bg-slate-700 transition-colors">
                  <td className="px-6 py-4 whitespace-nowrap text-sm text-white">
                    {transaction.date}
                  </td>
                  <td className="px-6 py-4 text-sm text-white">
                    {transaction.description}
                  </td>
                  <td className="px-6 py-4 whitespace-nowrap">
                    <span className={`inline-flex px-2 py-1 text-xs font-semibold rounded-full ${
                      transaction.type === 'deposit' ? 'bg-green-100 text-green-800' :
                      transaction.type === 'withdrawal' ? 'bg-red-100 text-red-800' :
                      transaction.type === 'transfer' ? 'bg-blue-100 text-blue-800' :
                      transaction.type === 'bill' ? 'bg-yellow-100 text-yellow-800' :
                      'bg-gray-100 text-gray-800'
                    }`}>
                      {transaction.type}
                    </span>
                  </td>
                  <td className={`px-6 py-4 whitespace-nowrap text-sm text-right font-medium ${
                    transaction.amount > 0 ? 'text-green-400' : 'text-red-400'
                  }`}>
                    {transaction.amount > 0 ? '+' : ''}${Math.abs(transaction.amount).toFixed(2)}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );

  const PaymentsPage = () => {
    const [selectedTab, setSelectedTab] = React.useState('send');
    const [paymentForm, setPaymentForm] = React.useState({
      recipient: '',
      amount: '',
      description: ''
    });

    const handleSubmit = (e) => {
      e.preventDefault();
      alert(`Payment of $${paymentForm.amount} to ${paymentForm.recipient} initiated!`);
      setPaymentForm({ recipient: '', amount: '', description: '' });
    };

    return (
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div className="mb-8">
          <h2 className="text-3xl font-bold text-white">Payments & Transfers</h2>
          <p className="text-slate-400 mt-2">Send money, pay bills, and manage payment requests</p>
        </div>

        <div className="bg-slate-800 rounded-lg border border-slate-700 mb-8">
          <div className="border-b border-slate-700">
            <nav className="flex space-x-8 px-6">
              <button
                onClick={() => setSelectedTab('send')}
                className={`py-4 px-1 border-b-2 font-medium text-sm transition-colors ${
                  selectedTab === 'send'
                    ? 'border-blue-500 text-blue-400'
                    : 'border-transparent text-slate-400 hover:text-slate-300'
                }`}
              >
                Send Money
              </button>
              <button
                onClick={() => setSelectedTab('bills')}
                className={`py-4 px-1 border-b-2 font-medium text-sm transition-colors ${
                  selectedTab === 'bills'
                    ? 'border-blue-500 text-blue-400'
                    : 'border-transparent text-slate-400 hover:text-slate-300'
                }`}
              >
                Pay Bills
              </button>
              <button
                onClick={() => setSelectedTab('requests')}
                className={`py-4 px-1 border-b-2 font-medium text-sm transition-colors ${
                  selectedTab === 'requests'
                    ? 'border-blue-500 text-blue-400'
                    : 'border-transparent text-slate-400 hover:text-slate-300'
                }`}
              >
                Payment Requests
              </button>
            </nav>
          </div>

          <div className="p-6">
            {selectedTab === 'send' && (
              <form onSubmit={handleSubmit} className="max-w-md">
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-2">
                      Recipient
                    </label>
                    <input
                      type="text"
                      value={paymentForm.recipient}
                      onChange={(e) => setPaymentForm({...paymentForm, recipient: e.target.value})}
                      className="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="Enter recipient name or email"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-2">
                      Amount
                    </label>
                    <input
                      type="number"
                      step="0.01"
                      value={paymentForm.amount}
                      onChange={(e) => setPaymentForm({...paymentForm, amount: e.target.value})}
                      className="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="0.00"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-2">
                      Description (Optional)
                    </label>
                    <input
                      type="text"
                      value={paymentForm.description}
                      onChange={(e) => setPaymentForm({...paymentForm, description: e.target.value})}
                      className="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="What's this for?"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-blue-600 hover:bg-blue-700 py-2 px-4 rounded-md font-medium transition-colors"
                  >
                    Send Payment
                  </button>
                </div>
              </form>
            )}

            {selectedTab === 'bills' && (
              <div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                  <button className="bg-slate-700 hover:bg-slate-600 p-6 rounded-lg text-center transition-colors">
                    <div className="text-3xl mb-2">⚡</div>
                    <div className="font-medium">Electricity</div>
                    <div className="text-sm text-slate-400">Due in 5 days</div>
                  </button>
                  <button className="bg-slate-700 hover:bg-slate-600 p-6 rounded-lg text-center transition-colors">
                    <div className="text-3xl mb-2">📱</div>
                    <div className="font-medium">Phone</div>
                    <div className="text-sm text-slate-400">Due in 12 days</div>
                  </button>
                  <button className="bg-slate-700 hover:bg-slate-600 p-6 rounded-lg text-center transition-colors">
                    <div className="text-3xl mb-2">🌐</div>
                    <div className="font-medium">Internet</div>
                    <div className="text-sm text-slate-400">Due in 18 days</div>
                  </button>
                </div>
                <p className="text-slate-400 text-center">Click on a bill to pay it</p>
              </div>
            )}

            {selectedTab === 'requests' && (
              <div className="space-y-4">
                {paymentRequests.map(request => (
                  <div key={request.id} className="flex justify-between items-center bg-slate-700 p-4 rounded-lg">
                    <div>
                      <div className="font-medium text-white">{request.recipient}</div>
                      <div className="text-sm text-slate-400">${request.amount.toFixed(2)}</div>
                    </div>
                    <div className="flex items-center space-x-3">
                      <span className={`px-3 py-1 rounded-full text-xs font-medium ${
                        request.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                        request.status === 'completed' ? 'bg-green-100 text-green-800' :
                        'bg-blue-100 text-blue-800'
                      }`}>
                        {request.status}
                      </span>
                      {request.status === 'pending' && (
                        <div className="space-x-2">
                          <button className="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-sm transition-colors">
                            Approve
                          </button>
                          <button className="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm transition-colors">
                            Decline
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    );
  };

  const AnalyticsPage = () => {
    const monthlyData = [
      { month: 'Jan', income: 3250, expenses: 2100 },
      { month: 'Feb', income: 3250, expenses: 2350 },
      { month: 'Mar', income: 3250, expenses: 1950 },
      { month: 'Apr', income: 3250, expenses: 2250 },
      { month: 'May', income: 3250, expenses: 2400 },
      { month: 'Jun', income: 3250, expenses: 2100 }
    ];

    const categories = [
      { name: 'Food & Dining', amount: 847, color: 'bg-red-500' },
      { name: 'Transportation', amount: 234, color: 'bg-blue-500' },
      { name: 'Shopping', amount: 456, color: 'bg-green-500' },
      { name: 'Bills & Utilities', amount: 678, color: 'bg-yellow-500' },
      { name: 'Entertainment', amount: 123, color: 'bg-purple-500' }
    ];

    return (
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div className="mb-8">
          <h2 className="text-3xl font-bold text-white">Financial Analytics</h2>
          <p className="text-slate-400 mt-2">Insights into your spending patterns and financial health</p>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
          <div className="bg-slate-800 rounded-lg p-6 border border-slate-700">
            <h3 className="text-xl font-semibold text-white mb-6">Monthly Overview</h3>
            <div className="space-y-4">
              {monthlyData.map(month => (
                <div key={month.month} className="flex items-center justify-between">
                  <div className="text-sm font-medium text-slate-300 w-12">{month.month}</div>
                  <div className="flex-1 mx-4">
                    <div className="flex space-x-2">
                      <div className="flex-1 bg-slate-700 rounded-full h-6 relative overflow-hidden">
                        <div 
                          className="bg-green-500 h-full rounded-full"
                          style={{width: `${(month.income / 4000) * 100}%`}}
                        ></div>
                        <div className="absolute inset-0 flex items-center justify-center text-xs font-medium">
                          +${month.income}
                        </div>
                      </div>
                      <div className="flex-1 bg-slate-700 rounded-full h-6 relative overflow-hidden">
                        <div 
                          className="bg-red-500 h-full rounded-full"
                          style={{width: `${(month.expenses / 4000) * 100}%`}}
                        ></div>
                        <div className="absolute inset-0 flex items-center justify-center text-xs font-medium">
                          -${month.expenses}
                        </div>
                      </div>
                    </div>
                  </div>
                  <div className="text-sm font-medium text-white w-16 text-right">
                    ${month.income - month.expenses}
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-6 flex justify-between text-sm">
              <div className="flex items-center">
                <div className="w-3 h-3 bg-green-500 rounded-full mr-2"></div>
                <span className="text-slate-300">Income</span>
              </div>
              <div className="flex items-center">
                <div className="w-3 h-3 bg-red-500 rounded-full mr-2"></div>
                <span className="text-slate-300">Expenses</span>
              </div>
            </div>
          </div>

          <div className="bg-slate-800 rounded-lg p-6 border border-slate-700">
            <h3 className="text-xl font-semibold text-white mb-6">Spending by Category</h3>
            <div className="space-y-4">
              {categories.map(category => (
                <div key={category.name} className="flex items-center">
                  <div className={`w-4 h-4 ${category.color} rounded-full mr-3`}></div>
                  <div className="flex-1">
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-sm font-medium text-white">{category.name}</span>
                      <span className="text-sm text-slate-300">${category.amount}</span>
                    </div>
                    <div className="w-full bg-slate-700 rounded-full h-2">
                      <div 
                        className={`${category.color} h-2 rounded-full`}
                        style={{width: `${(category.amount / 1000) * 100}%`}}
                      ></div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
          <div className="bg-slate-800 rounded-lg p-6 border border-slate-700 text-center">
            <h4 className="text-lg font-medium text-slate-300 mb-2">Credit Score</h4>
            <div className="text-3xl font-bold text-green-400 mb-2">742</div>
            <div className="text-sm text-slate-400">Good</div>
          </div>
          <div className="bg-slate-800 rounded-lg p-6 border border-slate-700 text-center">
            <h4 className="text-lg font-medium text-slate-300 mb-2">Savings Rate</h4>
            <div className="text-3xl font-bold text-blue-400 mb-2">23%</div>
            <div className="text-sm text-slate-400">Above Average</div>
          </div>
          <div className="bg-slate-800 rounded-lg p-6 border border-slate-700 text-center">
            <h4 className="text-lg font-medium text-slate-300 mb-2">Monthly Budget</h4>
            <div className="text-3xl font-bold text-yellow-400 mb-2">85%</div>
            <div className="text-sm text-slate-400">Used</div>
          </div>
          <div className="bg-slate-800 rounded-lg p-6 border border-slate-700 text-center">
            <h4 className="text-lg font-medium text-slate-300 mb-2">Investment Growth</h4>
